# src/main/resources/application-prod.properties
# Los valores reales llegan por variables de entorno (Railway/Render o docker run -e).
# La contraseña no tiene un valor por defecto utilizable.
# DATASOURCE_URL completa tiene prioridad; si no se define, la URL se arma con
# DB_HOST / DB_PORT / DB_NAME (así las entrega Render en render.yaml)
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}}
spring.datasource.username=${DATASOURCE_USER:appuser}
spring.datasource.password=${DATASOURCE_PASSWORD:}

# Hibernate no modifica el esquema en producción: solo valida que coincida
# con las entidades. La tabla la crea schema-postgresql.sql (CREATE TABLE IF
# NOT EXISTS), que solo se ejecuta con este perfil.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.com.universidad=INFO
# Mantiene visible en producción la línea de arranque con el perfil activo
logging.level.com.universidad.catalogo.CatalogoApplication=INFO

# Actuator: en producción solo health e info, sin detalles internos
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
