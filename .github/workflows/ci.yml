# .github/workflows/ci.yml
# Pipeline de integración continua: compila y prueba el proyecto, construye la
# imagen Docker con el mismo Dockerfile de la Parte 1 y verifica con un smoke
# test que el contenedor arranca y /actuator/health responde UP.
# No publica la imagen en ningún registro (no necesita Secrets externos).
name: CI — Build, Test & Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Compilar y ejecutar pruebas ──────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21 con caché Maven
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # verify ejecuta las pruebas y además el umbral de cobertura de JaCoCo (70%)
      - name: Compilar y ejecutar pruebas
        run: mvn -B clean verify

      - name: Publicar reporte de pruebas como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # ── Job 2: Construir la imagen y verificar el monitoreo ──────────
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test   # solo se construye la imagen si las pruebas pasaron
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir la imagen Docker
        run: docker build -t mi-spring-app:${{ github.sha }} .

      # Sin variables de entorno: el contenedor arranca con el perfil dev (H2)
      - name: Levantar el contenedor y esperar /actuator/health
        run: |
          docker run -d --name smoke-test -p 8080:8080 mi-spring-app:${{ github.sha }}

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "La aplicacion respondio UP"
              curl -s http://localhost:8080/actuator/health
              echo
              exit 0
            fi
            echo "Esperando a que la aplicacion arranque... (${i}/30)"
            sleep 2
          done

          echo "La aplicacion no respondio UP a tiempo"
          docker logs smoke-test
          exit 1

      - name: Detener el contenedor de prueba
        if: always()
        run: docker rm -f smoke-test || true
